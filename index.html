<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="navLogo">
            <img id="navImg" src="./assets/logo.png" alt="">
        </div>
        <div class="navLinks">
            <p class="links">Home</p>
            <p class="links">Products</p>
            <p class="links">Contact</p>
            <button id="navLinksButton">
                <div class="buttonClass"><p>Place Order</p>
                <img src="./assets/placeOrder.svg" alt=""></div>
            </button>
        </div>
    </nav>
    <section class="gapahh">
        <button class="gapahhButtons">Products</button>
        <button id="gapahhTransparent" class="gapahhButtons">Custom</button>
    </section>
    <section class="bigbox">
        <div class="box1">
            <h2 id="mainText">FIND YOUR <br>GREATNESS</h2>
            <p id="mainPara">Built for speed and confidence, every pair combines premium materials and bold design. Engineered for comfort, made for movement.</p>
        </div>
        <div class="box2">
            <h1 id="hype">HYPE</h1>
            <img id="heroImg" src="./assets/shoe.png" alt="">
        </div>
        <div class="box3">
            <p >Choose your Color</p>
            <div class="colorOptions">
                <div class="colorPallete aqua"></div>
                <div class="colorPallete orange"></div>
                <div class="colorPallete red"></div>
            </div>
            <div class="sizeOptions">
                <div class="sizeCircle size1">40</div>
                <div class="sizeCircle size2">42</div>
                <div class="sizeCircle size3">44</div>
            </div>
        </div>

    </section>

    <footer>
        <div class="icons">
            <div class="social insta">
                <img src="./assets/instagram.svg" alt="">
            </div>
            <div class="social fb">
                <img src="./assets/facebook.svg" alt="">
            </div>
            <div class="social pin">
                <img src="./assets/pinterest.svg" alt="">
            </div>
            <div class="social yt">
                <img src="./assets/youtube.svg" alt="">
            </div>
        </div>
        <div class="byeByeText">
            <p style="letter-spacing: -1px;">――――――――</p>
            <p style="letter-spacing: 2px; font-size: 14px;">SNEAKERS FOR MORE</p>
            <p style="letter-spacing: -1px;">――――――――</p>
        </div>
        <div class="lastButton">
            <button id="lastButton" style="letter-spacing: 1px; font-weight: 800;"> See all products </button>
        </div>
    </footer>
</body>
</html>
